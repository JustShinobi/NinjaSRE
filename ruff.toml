target-version = "py312"
line-length = 100

exclude = [
    "_research",
    ".venv",
    "build",
    "dist",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes — unused imports and names
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]

ignore = [
    "E501",   # line too long — the formatter owns line breaking
    "B008",   # function call in a default argument
    "B905",   # zip() without an explicit strict=
    "SIM108", # ternary instead of if-else
]

[lint.per-file-ignores]
# Package roots re-export their public surface; those imports are not unused.
"**/__init__.py" = ["F401"]
# pytest fixtures arrive as parameters that a test may never reference, and a
# test double implementing a Protocol keeps the full signature.
"tests/**/*.py" = ["ARG001", "ARG002"]
# A Protocol implementation keeps every parameter whether or not it uses one —
# that is what makes it substitutable, and narrowing a signature to satisfy a
# linter is how an adapter stops being interchangeable with the others.
"core/llm/providers/*.py" = ["ARG002"]
"core/llm/transports/*.py" = ["ARG002"]
# The neutral effectiveness provider ignores both arguments on purpose — that
# is what "no history, therefore no opinion" means — and it has to keep the
# port's full signature to remain substitutable with the one feature 010 fills.
"core/capability/ports.py" = ["ARG002"]
# Same reason, one layer up: a conclusion policy that accepts everything reads
# neither the session nor the answer, and narrowing its signature would stop it
# being substitutable with the policies that do.
"core/agent/conclusion.py" = ["ARG002"]
# A hook keeps its point's full signature whether or not it reads every
# argument — that is what makes one hook substitutable for another at the same
# point, and the registry dispatches on arity it can rely on.
"core/agent/hooks/builtin/*.py" = ["ARG001"]
# The neutral implementations of the pipeline's ports ignore their arguments on
# purpose — an empty catalogue, a ranker with no opinion, an index that knows of
# no incidents — and each keeps its port's full signature so an ablation can
# substitute it for the real one without the stage noticing.
"core/pipeline/ports.py" = ["ARG002"]
# The incident-window guard keeps the hook point's full signature — it decides
# from the call's arguments alone and never reads the tool context — so it stays
# substitutable with the masking and approval hooks at the same point.
"core/pipeline/stages/window_guard.py" = ["ARG002"]
# The plain-text alert adapter matches everything, so its predicate reads
# nothing — that is what "adapter of last resort" means. It keeps the port's
# full signature so detection can try it alongside the seven that do look.
"core/domain/alerts/normalisation.py" = ["ARG002"]
# The no-human channel ignores the question on purpose — that is what "there is
# nobody attached to this run" means — and it keeps the port's full signature so
# a surface can be substituted for it without the loop noticing.
"core/agent/handoff.py" = ["ARG002"]
# The architecture fixtures exist to violate import boundaries on purpose. They
# are never imported by the real package graph (pytest skips the directory via
# ``norecursedirs``), so their imports are unused by construction.
"tests/architecture/fixtures/**/*.py" = ["ARG001", "F401"]

[lint.isort]
known-first-party = [
    "capabilities",
    "config",
    "core",
    "gateway",
    "integrations",
    "platform",
    "surfaces",
    "tests",
    "tools",
]
