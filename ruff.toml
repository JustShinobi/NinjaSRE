target-version = "py312"
line-length = 100

exclude = [
    "_research",
    ".venv",
    "build",
    "dist",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes — unused imports and names
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]

ignore = [
    "E501",   # line too long — the formatter owns line breaking
    "B008",   # function call in a default argument
    "B905",   # zip() without an explicit strict=
    "SIM108", # ternary instead of if-else
]

[lint.per-file-ignores]
# Package roots re-export their public surface; those imports are not unused.
"**/__init__.py" = ["F401"]
# pytest fixtures arrive as parameters that a test may never reference, and a
# test double implementing a Protocol keeps the full signature.
"tests/**/*.py" = ["ARG001", "ARG002"]
# A Protocol implementation keeps every parameter whether or not it uses one —
# that is what makes it substitutable, and narrowing a signature to satisfy a
# linter is how an adapter stops being interchangeable with the others.
"core/llm/providers/*.py" = ["ARG002"]
"core/llm/transports/*.py" = ["ARG002"]
# The architecture fixtures exist to violate import boundaries on purpose. They
# are never imported by the real package graph (pytest skips the directory via
# ``norecursedirs``), so their imports are unused by construction.
"tests/architecture/fixtures/**/*.py" = ["ARG001", "F401"]

[lint.isort]
known-first-party = [
    "capabilities",
    "config",
    "core",
    "gateway",
    "integrations",
    "platform",
    "surfaces",
    "tests",
    "tools",
]
