# The full scenario corpus, on a schedule and before a release.
#
# The pull-request path runs the corpus offline, against recorded transcripts,
# because a gate that spent tokens on every push is a gate somebody eventually
# turns off. That path proves the harness, the fixtures, and the pipeline; it
# cannot prove anything about a model, because no model runs.
#
# This job is the other half. It repeats every scenario so variance is visible,
# publishes a verdict record per attempt, and reports by difficulty level — the
# stratification that distinguishes an improvement which helped everywhere from
# one that helped on the easy cases.
#
# It is deliberately not a pull-request gate. A scheduled run that regresses is
# a finding somebody reads; a per-push run that regresses on sampling noise is a
# gate people learn to re-run until it goes green.

name: scenarios

on:
  # No cron. The scenario corpus runs on hosted minutes, and an unattended
  # schedule spends them with nobody reading what it found. Ask for it when
  # somebody is going to look at the answer.
  workflow_dispatch:
    inputs:
      attempts:
        description: Attempts per scenario, for variance
        required: false
        default: "5"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  corpus:
    name: full scenario corpus
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Provision the environment
        run: make install

      - name: Run every scenario, repeatedly
        run: |
          make test-synthetic \
            ATTEMPTS="${{ github.event.inputs.attempts || '5' }}" \
            ARTIFACTS=scenario-verdicts.jsonl

      # The gate, on the scheduled path only. It scores every attempt on five
      # independent axes and compares the result against the stored release
      # baseline, failing with the scenarios and axes named. A cost regression
      # fails on its own, so a change that bought accuracy at triple the price
      # is visible as the trade-off it is rather than as a silent pass.
      #
      # It runs even when the corpus reported a failure above, because a failing
      # scenario and a regression against the baseline are different findings
      # and the second is the one that says whether anything changed.
      - name: Gate against the stored baseline
        if: always()
        run: |
          make evaluate \
            BASELINE=release \
            ATTEMPTS="${{ github.event.inputs.attempts || '5' }}"

      - name: Publish the verdict records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-verdicts
          path: scenario-verdicts.jsonl
          if-no-files-found: warn

  # The hypervisor half, which is cheap and runs on every path rather than only
  # on this one. It reads recorded API responses through the shipped
  # investigation tools and scores recorded transcripts, so it spends no tokens
  # and needs no cluster — `make verify` already runs it through the test suite.
  #
  # It is here as well for the two things a pull request does not produce: the
  # full artefact, with every transcript and every reading behind every verdict,
  # and the statement of which destructive scenarios were simulated. Both are
  # what a release note cites.
  hypervisor:
    name: hypervisor scenarios
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Provision the environment
        run: make install

      - name: Score the scenarios and gate them against the committed baseline
        run: make test-proxmox-scenarios

      - name: Assert every hypervisor write is exercised by a scenario
        if: always()
        run: make proxmox-scenario-coverage

      - name: State which destructive scenarios were real
        if: always()
        run: make e2e-proxmox-laboratory

      - name: Publish the scored runs
        if: always()
        run: |
          PYTHONPATH="$PWD" uv run python -m tests.harness.proxmox --json \
            > proxmox-scenario-runs.json

      - name: Upload the scored runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxmox-scenario-runs
          path: proxmox-scenario-runs.json
          if-no-files-found: warn
