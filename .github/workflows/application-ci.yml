name: Application pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The gate is not run here. `make verify` is what a contributor runs before
# pushing, and running the identical work again on a hosted runner adds minutes
# to every deploy without checking anything the local run has not already
# checked. `.github/workflows/verify.yml` still exists for the occasions where a
# clean machine is the point — a release candidate, a dependency bump, an answer
# to "does it pass anywhere but that laptop" — and is dispatched by hand.
#
# What this costs is worth stating plainly, because nothing here enforces it:
# a change that reaches this pipeline unverified is deployed unverified. The gate
# is now a habit rather than a control.

jobs:
  release:
    uses: JustShinobi/platform-workflows/.github/workflows/application-release.yml@9aa36133f80e32958a8afe7d539d04945a35d366
    with:
      descriptor: .ci/application.yaml
    secrets: inherit
