# The chaos suite, on a schedule and before a release.
#
# Deliberately not a pull-request gate. It creates a cluster, breaks it on
# purpose, and takes twenty minutes; a gate that expensive is one people learn
# to skip, and its value was never in blocking a merge. Its value is finding
# failure modes the synthetic corpus does not know to contain — and every one it
# finds becomes a synthetic scenario, which *is* on the pull-request path.
#
# The cluster is created and destroyed inside the job. Nothing survives it, so
# there is no shared cluster for two runs to corrupt and no state for a
# cancelled run to leave behind. The suite's own lock and label sweep are still
# there, because a job that is cancelled half way through is a real event and
# the next run has to be able to tell.

name: chaos

on:
  # No cron. The chaos drill runs on hosted minutes, and an unattended
  # schedule spends them with nobody reading what it found. Ask for it when
  # somebody is going to look at the answer.
  workflow_dispatch:
    inputs:
      experiment:
        description: Run only experiments matching this
        required: false
        default: ""

concurrency:
  # One chaos run at a time. The suite's cluster lock covers a shared cluster;
  # this covers two jobs each creating their own and exhausting the runner.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  chaos:
    name: chaos experiments
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync

      - name: Install kind and helm
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Create the cluster and install the chaos framework
        run: make chaos-setup

      # The catalogue and the framework, against a real cluster, with no faults
      # injected. This is the part that runs without a composed investigator and
      # it is what catches a broken manifest or an uninstalled CRD.
      - name: Preflight and catalogue
        run: uv run pytest tests/chaos -v

      - name: Sweep anything left behind
        if: always()
        run: make chaos-sweep || true

      - name: Destroy the cluster
        if: always()
        run: make chaos-teardown

  reaper:
    name: cloud orphan sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Independent of any run, which is the whole point: it is the mechanism that
    # covers a run the deferred teardown never got to. Reports rather than
    # destroys, so a person decides — and sees the list either way.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync

      - name: Report anything the suite left in the account
        run: make e2e-reap
        continue-on-error: true
