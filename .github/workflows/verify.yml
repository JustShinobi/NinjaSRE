# The quality gate, on the three platforms FR-017 says NinjaSRE must run on.
#
# One job, one command. CI runs exactly `make verify` — the same thing a
# contributor runs locally — so a green local run means a green CI run. A CI
# pipeline that checks more than the local gate teaches people to push and wait
# instead of verifying first.

name: verify

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports. A Windows-only path failure is exactly the kind
      # of thing a fail-fast matrix hides behind an unrelated Linux error.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        # Git Bash on Windows. The Makefile is POSIX shell only, and FR-017
        # rules out requiring WSL.
        shell: bash

    env:
      # A machine with no toolchain gets a named skip locally, because a gate
      # that goes red for a reason a contributor cannot act on is a gate they
      # learn to bypass. Here there is no such excuse: this is where the console
      # half is enforced, so a skip is a failure.
      NINJASRE_CONSOLE_TOOLCHAIN: required

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install GNU Make
        if: runner.os == 'Windows'
        run: choco install make --no-progress --yes

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The pinned Node distribution, the pinned pnpm, the browser and the
      # installed dependencies. Keyed on the files that decide what any of them
      # are, so a run that changes no dependency restores rather than reinstalls
      # — and a run that changes one cannot restore a cache built from the old
      # one.
      - name: Restore the console toolchain
        uses: actions/cache@v4
        with:
          path: |
            console/.toolchain
            console/node_modules
          key: >-
            console-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('console/toolchain.lock.json', 'console/.node-version',
            'console/pnpm-lock.yaml', 'console/package.json') }}

      - name: Provision the environment
        run: make install

      # Provisioned before the gate rather than inside it, so a slow first
      # install shows up as its own step with its own duration instead of
      # disappearing into the gate's total.
      - name: Provision the console toolchain
        run: make console-setup

      - name: Install the pinned browser
        run: >-
          PLAYWRIGHT_BROWSERS_PATH="$PWD/console/.toolchain/browsers"
          uv run python -m tools.console_toolchain run exec playwright install chromium

      - name: Run the quality gate
        run: make verify

  console-visual:
    name: console visual regression (pinned image)
    # Linux only, and one job rather than three. The baselines are captured in
    # one pinned container image and compared only against captures from it —
    # font rasterisation differs between platforms, so a comparison anywhere
    # else reports differences that mean nothing. The hosted macOS runner has no
    # container runtime and the Windows one runs Windows containers, so this is
    # the only place the comparison is meaningful.
    #
    # `make verify` runs it too, and skips with a name where it cannot. This job
    # is where it is enforced.
    runs-on: ubuntu-latest

    env:
      NINJASRE_CONSOLE_TOOLCHAIN: required

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore the console toolchain
        uses: actions/cache@v4
        with:
          path: |
            console/.toolchain
            console/node_modules
          key: >-
            console-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('console/toolchain.lock.json', 'console/.node-version',
            'console/pnpm-lock.yaml', 'console/package.json') }}

      - name: Provision the environment
        run: make install

      - name: Provision the console toolchain
        run: make console-setup

      - name: Build the console
        run: make console-build

      - name: Compare every screen against its baseline
        run: make console-visual

      # The artefact is the point. A run that failed with "images differ" and no
      # image is a run people accept blind.
      - name: Publish the differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-visual-differences
          path: |
            console/test-results
            console/playwright-report
          if-no-files-found: warn

  console-e2e-compose:
    name: console end to end (compose stack)
    # The deployment's own compose definition: a real gateway against a real
    # database. `make verify` runs the same suite against the committed dataset,
    # which is deterministic and fast; this is the half that would catch a
    # console working against the dataset and not against the application.
    #
    # Its own job because it builds four images and brings up a stack, which is
    # minutes rather than seconds.
    runs-on: ubuntu-latest

    env:
      NINJASRE_CONSOLE_TOOLCHAIN: required

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore the console toolchain
        uses: actions/cache@v4
        with:
          path: |
            console/.toolchain
            console/node_modules
          key: >-
            console-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('console/toolchain.lock.json', 'console/.node-version',
            'console/pnpm-lock.yaml', 'console/package.json') }}

      - name: Provision the environment
        run: make install

      - name: Provision the console toolchain
        run: make console-setup

      - name: Install the pinned browser
        run: >-
          PLAYWRIGHT_BROWSERS_PATH="$PWD/console/.toolchain/browsers"
          uv run python -m tools.console_toolchain run exec playwright install --with-deps chromium

      - name: Build the console
        run: make console-build

      - name: Drive a browser against the compose stack
        run: make console-e2e-run BACKING=compose

  console-budget:
    name: the gate's cold and warm budgets
    # NFR-001 as a number rather than an intention. Cold is a runner with
    # nothing cached; warm is the same runner immediately afterwards. Reporting
    # both from one job is what makes the difference between them meaningful.
    runs-on: ubuntu-latest

    env:
      NINJASRE_CONSOLE_TOOLCHAIN: required

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Provision the environment
        run: make install

      - name: Time a cold gate
        run: uv run python -m tools.measure_verify --profile cold

      - name: Time a warm gate
        run: uv run python -m tools.measure_verify --profile warm

  persistence:
    name: persistence contract suite (PostgreSQL)
    # Linux only. The job needs a Docker daemon to build the PostgreSQL image
    # that carries both pgvector and Apache AGE — nothing published carries
    # both — and the hosted macOS and Windows runners have none. The ports are
    # platform-independent; the database they run against is not.
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Provision the environment
        run: make install

      # SC-005 is "the contract suite passes against the Postgres
      # implementation *and* against the fakes". `make verify` above covers the
      # fakes. This is the other half, and the feature is not done without it.
      - name: Run the persistence contract suite against PostgreSQL
        run: make test-postgres

  first-run:
    name: install to first investigation (${{ matrix.os }})
    # SC-001 gives a clean machine ten minutes to get from nothing to a working
    # investigation, on all three platforms. The deterministic part of that
    # path is measured here on every pull request; the part that spends real
    # tokens against an operator's own provider is measured by
    # `make preflight`, and the script says which is which rather than
    # reporting a total that quietly excludes the slow leg.
    #
    # A separate job from `verify` because it installs into an empty
    # environment. Reusing the gate's environment would measure an install onto
    # a machine that already had every dependency, which is the one machine
    # SC-001 is not about.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Deliberately no uv, and deliberately nothing installed first. The
      # script builds the distribution and installs it into a venv it creates,
      # which is the closest a hosted runner gets to a clean machine.
      - name: Measure the path from nothing to a usable command
        run: python tools/measure_first_investigation.py --json

  docs:
    name: build the documentation site
    # `make verify` already fails on a stale generated reference and on a
    # documented command that no longer works. This job exists for the artefact:
    # the site is published from the repository build rather than from anybody's
    # laptop, so what a reader gets is what this commit produces.
    #
    # Uploaded rather than deployed. Where the site is hosted is the operator's
    # decision — some run it on an internal host and some do not host it at all,
    # because it builds and serves offline from the checkout.
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Provision the environment
        run: make install

      - name: Build the site
        run: make docs-build

      - name: Publish the built site
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: docs/site/build
          if-no-files-found: error

  scenarios:
    name: synthetic scenario corpus (offline)
    # Every pull request, and it costs nothing. The corpus runs against
    # recorded vendor responses and recorded model transcripts, so there is no
    # credential to hold and no token to spend — which is the property that
    # makes running a regression gate on every push affordable at all.
    #
    # `make verify` already runs the corpus as part of the suite. This job
    # exists for the artefact: it writes a verdict record per attempt and
    # publishes the report, so a failure can be diagnosed from the run page
    # rather than by re-running the suite locally.
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Provision the environment
        run: make install

      - name: Run the corpus offline
        run: make test-synthetic ARTIFACTS=scenario-verdicts.jsonl

      - name: Publish the verdict records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-verdicts
          path: scenario-verdicts.jsonl
          if-no-files-found: warn

  images:
    name: build the deployment images and scan them
    # Not part of `verify`: it builds four images, which is minutes rather than
    # seconds. Its own job so a vulnerable base image is a red job with a name
    # rather than a slow gate people learn to skip.
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the application, console, and proxy images
        run: |
          for component in app console proxy; do
            docker build -f "deploy/images/${component}.Dockerfile" \
              -t "ninjasre/${component}:ci" .
          done

      - name: Build the datastore image
        run: docker build -f deploy/images/postgres.Dockerfile -t ninjasre/postgres:ci .

      # Fails the job on a fixable HIGH or CRITICAL. Unfixable ones are reported
      # and not failed on: a base image with an open CVE nobody has patched yet
      # is not something this repository can act on, and a gate that cannot be
      # made green is a gate somebody disables.
      - name: Scan every image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ninjasre/app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan the datastore image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ninjasre/postgres:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  chart:
    name: helm chart lint and install
    # SC-002's counterpart for the enterprise profile: a chart that lints and a
    # release that installs. The structural assertions run in `make verify`
    # without a cluster; this is the half that needs one.
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint the chart
        run: helm lint deploy/helm/ninjasre

      # Renders every template against the defaults and against the two
      # combinations that change the object graph, so a values file that only
      # works one way fails here rather than during somebody's install.
      - name: Render the chart three ways
        run: |
          helm template ninjasre deploy/helm/ninjasre > /dev/null
          helm template ninjasre deploy/helm/ninjasre \
            --set sso.enabled=true --set otel.enabled=true > /dev/null
          helm template ninjasre deploy/helm/ninjasre \
            --set postgres.external=false \
            --set postgres.inCluster.enabled=true \
            --set postgres.inCluster.image=ninjasre/postgres:ci > /dev/null

      - name: Create a cluster
        uses: helm/kind-action@v1

      # `--dry-run=server` rather than a real install: the chart's workloads
      # need images this job has not built and a database it has no reason to
      # provision, and what is worth checking here is that the API server
      # accepts every manifest the chart produces.
      - name: Install against the cluster
        run: |
          kubectl create namespace ninjasre
          helm install ninjasre deploy/helm/ninjasre \
            --namespace ninjasre --dry-run=server

  backup-restore:
    name: backup, restore, and verify
    # FR-018 and SC-004: the cycle runs against a real PostgreSQL carrying both
    # extensions, because a backup procedure nobody has restored is a procedure
    # nobody has.
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Provision the environment
        run: make install

      - name: Run the backup and restore cycle
        run: sh test-infra/backup/cycle.sh
