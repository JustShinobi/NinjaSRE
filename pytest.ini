[pytest]
testpaths =
    tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short --strict-markers --durations=20

# The architecture fixtures are deliberately broken module trees fed to
# import-linter. Collecting them would import the very violations they encode.
norecursedirs =
    tests/architecture/fixtures
    _research
    .git
    .venv
    __pycache__
    .pytest_cache
    .mypy_cache
    .ruff_cache
    node_modules

asyncio_mode = auto

markers =
    unit: fast and isolated; no network, no database, no filesystem beyond tmp_path
    architecture: asserts a tier boundary holds; fails the build when it does not
    contract: provider, integration, or capability contract suite
    integration: exercises a real external dependency
    synthetic: deterministic scenario fixture with an answer key
    e2e: requires live infrastructure or credentials
