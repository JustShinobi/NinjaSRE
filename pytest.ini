[pytest]
testpaths =
    tests
python_files = test_*.py
python_functions = test_*
# TODO(validation-phase): re-evaluate before this leaves validation.
#
# `-v` used to be here, printing one line per test. At 12,633 tests that is
# 12,633 lines per run, and the unattended wave runs the suite twice a feature
# and streams every line through a logger and onto disk. Dropping it leaves the
# progress dots, which say the same thing about how far along the run is, and
# `--durations=20` still names what was slow.
#
# What it costs: a failure report no longer sits under a visible test name in
# the scrollback. `--tb=short` still names the test, so this is a readability
# trade and not an information one — but it is a trade, and it was made for
# speed during validation. Put `-v` back when that ends, or decide it was never
# worth it.
addopts = --tb=short --strict-markers --durations=20

# The architecture fixtures are deliberately broken module trees fed to
# import-linter. Collecting them would import the very violations they encode.
norecursedirs =
    tests/architecture/fixtures
    _research
    .git
    .venv
    __pycache__
    .pytest_cache
    .mypy_cache
    .ruff_cache
    node_modules

asyncio_mode = auto

markers =
    unit: fast and isolated; no network, no database, no filesystem beyond tmp_path
    architecture: asserts a tier boundary holds; fails the build when it does not
    contract: provider, integration, or capability contract suite
    integration: exercises a real external dependency
    synthetic: deterministic scenario fixture with an answer key
    e2e: requires live infrastructure or credentials
    security: red-team assertion about where a credential is not
    benchmark: asserts a latency budget rather than a behaviour
    console: drives the console's own toolchain; skips when it is not provisioned
