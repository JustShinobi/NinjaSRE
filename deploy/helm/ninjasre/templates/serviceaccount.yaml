# The identity the workloads run as, and the only permissions they need.
#
# Sandbox pods are created, watched, and deleted by the application in the
# `kubernetes` isolation profile, so those verbs are the RBAC. Nothing here can
# read a Secret it was not handed through an environment variable, and nothing
# can touch a resource outside this namespace — the Role is namespaced rather
# than a ClusterRole for exactly that reason.
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ninjasre.serviceAccountName" . }}
  labels:
    {{- include "ninjasre.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ninjasre.fullname" . }}-sandbox
  namespace: {{ .Values.sandbox.namespace | default .Release.Namespace }}
  labels:
    {{- include "ninjasre.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    # Log streaming is how an interrupted capability's partial output — which is
    # usually the whole diagnosis — reaches the trace.
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ninjasre.fullname" . }}-sandbox
  namespace: {{ .Values.sandbox.namespace | default .Release.Namespace }}
  labels:
    {{- include "ninjasre.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ninjasre.fullname" . }}-sandbox
subjects:
  - kind: ServiceAccount
    name: {{ include "ninjasre.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
