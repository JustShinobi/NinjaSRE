# The credential proxy: the only workload in this release that reads a secret.
#
# It has no `enabled` switch. Turning the proxy off would mean putting
# credentials in the agent's own process, which is the one thing the
# architecture does not permit — so the option does not exist to be found by
# somebody debugging at three in the morning.
#
# The NetworkPolicy below is the other half of that boundary: nothing but the
# application and the console may reach this Service, so a compromised sandbox
# pod cannot ask the proxy to authenticate a request on its behalf.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ninjasre.fullname" . }}-proxy
  labels:
    {{- include "ninjasre.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.proxy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ninjasre.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        {{- include "ninjasre.labels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
    spec:
      serviceAccountName: {{ include "ninjasre.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: proxy
          image: {{ include "ninjasre.image" (list . "proxy") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.proxy.port }}
          env:
            {{- include "ninjasre.env" . | nindent 12 }}
            {{- include "ninjasre.providerEnv" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - name: scratch
              mountPath: /tmp
            {{- include "ninjasre.caVolumeMounts" . | nindent 12 }}
      volumes:
        - name: scratch
          emptyDir: {}
        {{- include "ninjasre.caVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ninjasre.fullname" . }}-proxy
  labels:
    {{- include "ninjasre.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.proxy.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "ninjasre.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: proxy
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ninjasre.fullname" . }}-proxy
  labels:
    {{- include "ninjasre.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ninjasre.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ninjasre.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ninjasre.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: console
      ports:
        - protocol: TCP
          port: {{ .Values.proxy.port }}
