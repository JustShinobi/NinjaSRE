# Migrations, as a hook that finishes before the new release rolls out.
#
# The application would migrate at startup anyway, under its advisory lock, and
# that is what keeps a bare `kubectl apply` correct. Doing it as a job as well
# buys one thing an operator wants during an upgrade: a migration that cannot
# apply fails as a *failed job*, with the reason in one place, rather than as
# several replicas crash-looping with the same message interleaved.
#
# `hook-weight: -5` puts it before everything else in the same phase, and the
# delete policy keeps the failed job so its logs survive for somebody to read.
# `before-hook-creation` cleans up the previous successful one.
{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ninjasre.fullname" . }}-migrate
  labels:
    {{- include "ninjasre.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "ninjasre.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "ninjasre.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "ninjasre.image" (list . "app") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          # Migrate and exit. The advisory lock still applies, so this is safe
          # even if a replica of the previous release restarts alongside it.
          command: ["python", "-m", "gateway.http.serve", "--migrate-only"]
          env:
            {{- include "ninjasre.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            - name: scratch
              mountPath: /tmp
            {{- include "ninjasre.caVolumeMounts" . | nindent 12 }}
      volumes:
        - name: scratch
          emptyDir: {}
        {{- include "ninjasre.caVolumes" . | nindent 8 }}
{{- end }}
