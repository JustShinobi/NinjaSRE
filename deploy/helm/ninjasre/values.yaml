# Defaults for the enterprise profile.
#
# Two principles run through this file and both are worth stating, because a
# values file is where a well-designed system usually loses its properties.
#
# **Nothing here is a secret.** Every credential is a reference to a Secret the
# operator created — a name and a key, never a value. A chart that accepted an
# API key as a value would be a chart whose values file ends up in a Git
# repository with the key in it.
#
# **Every bound is a bound.** Replica counts, concurrency, and resource limits
# all have numbers here rather than being unset. An unset limit is not
# "unlimited by choice", it is a pod that gets evicted at the worst moment.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  repository: ninjasre
  # Pinned by digest in a release. A tag is a pointer somebody else can move,
  # and a rollout that pulled a different image than the one that was tested is
  # a rollout nobody can reason about.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# --- The application -----------------------------------------------------------

app:
  # One, and one until a stream bridge exists — not a starting point somebody
  # should raise for capacity. Both live channels fan out inside the process
  # that published the event: `RunEventBroker` accepts a `StreamBridge` and the
  # serving root hands it none, and `DeploymentEventBroker` has no bridge seam
  # at all. A second replica would not add capacity to the live console, it
  # would halve what a session sees — an SSE client is pinned to one replica,
  # every write the other handled never reaches it, and the freshness chip goes
  # on reading `live` throughout. There is no `StreamBridge` implementation in
  # this repository outside one test's own double, so raising this is a change
  # that starts with writing one.
  replicas: 1
  port: 8420
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # The scheduler is leader-claimed across replicas, so every replica runs one
  # and exactly one of them holds a job's lease at a time. There is no "run the
  # scheduler on replica zero" setting, because that is a single point of
  # failure wearing a configuration option's clothes.
  scheduler:
    enabled: true
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

console:
  enabled: true
  # Two is fine here, and for the reason `app.replicas` is not: this renders
  # pages and proxies the event stream onward, it never holds a broker, so a
  # browser talking to either replica is served the same events.
  replicas: 2
  port: 8421
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

proxy:
  # Never disabled. The credential proxy is the trust boundary — an option to
  # turn it off would be an option to put credentials in the agent's process.
  replicas: 2
  port: 8422
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# --- Migrations ----------------------------------------------------------------

migrations:
  # Runs as a pre-upgrade hook, to completion, before any replica of the new
  # release starts. The application would also migrate at startup under its
  # advisory lock; doing it in a job means a rollout that cannot migrate fails
  # as a failed job rather than as a crash-looping deployment.
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# --- Sandbox -------------------------------------------------------------------

sandbox:
  profile: kubernetes
  namespace: ""
  image: ""
  warmPoolSize: 2
  # The Envoy sidecar is the egress allow-list, and the NetworkPolicy is what
  # stops the sandbox container going round it. Neither is sufficient alone:
  # a sidecar without the policy is advice, and a policy without the sidecar
  # cannot express "this vendor's host and nothing else".
  egress:
    enabled: true
    image: envoyproxy/envoy:v1.39.0
    listenerPort: 15001
    adminPort: 15000
    networkPolicy: true

# --- Database ------------------------------------------------------------------

postgres:
  # `external` is the expectation in a regulated environment: somebody else's
  # team already runs PostgreSQL with the backup schedule and the retention
  # policy that estate requires. In-cluster exists for an evaluation.
  external: true
  urlSecret:
    name: ninjasre-database
    key: url
  inCluster:
    enabled: false
    image: ""
    storage: 50Gi
    storageClass: ""
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 8Gi

# --- Secrets -------------------------------------------------------------------

encryptionKey:
  # Operator-supplied, always. The chart will not generate one: a generated key
  # lives in a release's stored values and is discovered missing during a
  # restore, on somebody else's watch.
  secret:
    name: ninjasre-encryption-key
    key: key

provider:
  # Empty on purpose, and the one default in this file that is an absence
  # rather than a value.
  #
  # Connecting a model provider is a first-run step. The operator opens the
  # console, chooses one, and enters the key — which is stored in the vault,
  # encrypted with `encryptionKey.secret`, and rotated by writing to the
  # vault rather than by redeploying. A release that shipped a provider here
  # would be a release that puts a credential's home in a values file.
  #
  # Everything below is the other way, for a deployment that would rather be
  # handed its provider than click one. Set `id` and the workloads are told
  # which provider to use; set `credentialSecret.name` as well and they also
  # receive that provider's own key variable. Leave both alone and the
  # deployment starts, reports that it has no provider, and shows where to
  # connect one.
  id: ""
  model: ""
  credentialSecret:
    # Referenced only when `name` is set. A chart that demanded a Secret
    # nobody created would refuse to install a deployment that was
    # configured correctly.
    name: ""
    key: api-key
  # Not yet wired to a setting the deployment reads: every provider adapter
  # takes its own endpoint variable (`ANTHROPIC_BASE_URL`, `OLLAMA_BASE_URL`,
  # and so on — `config/constants/llm.py` names them all), and none of them is
  # this one. Left declared rather than removed so the eventual per-provider
  # wiring has a place to land; setting it today does nothing.
  baseUrl: ""

# --- Identity ------------------------------------------------------------------

sso:
  enabled: false
  issuer: ""
  clientId: ""
  clientSecretRef:
    name: ninjasre-sso
    key: client-secret
  # Which claim carries group membership, and how groups map to NinjaSRE roles.
  # Mapped explicitly rather than by name equality: an identity provider's
  # groups are named for that organisation, not for this system's roles.
  groupsClaim: groups
  roleMappings: {}

# --- Observability -------------------------------------------------------------

otel:
  enabled: false
  endpoint: ""
  protocol: grpc

logging:
  level: INFO
  format: json

# --- Egress --------------------------------------------------------------------

egress:
  # Turn this on for an air-gapped install. Startup refuses if any setting
  # implies an outbound connection, which is what makes "no egress" a property
  # the deployment checks rather than one the operator hopes for.
  airGapped: false
  allowlist: []
  caBundle:
    # A ConfigMap holding a PEM bundle, for a corporate proxy that terminates
    # TLS. Mounted read-only; there is deliberately no setting that turns
    # certificate verification off.
    configMap: ""
    key: ca-bundle.pem

# --- Pod security --------------------------------------------------------------

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""
  annotations: {}
