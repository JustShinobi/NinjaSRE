<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NinjaSRE">
  <!--
    The optical cut, for 24px and below: the favicon, a navigation entry, an
    avatar.

    Shorter points (a ratio of 0.53 against 0.48) and a larger hole. Reducing
    the main cut to 16px tapers the eight points until they close on one
    another and the hole disappears — the drawing becomes a round smudge. Here
    the points are thicker and the hole is big enough to survive a pixel.

    It is the same mark at a different cut, the way a typeface has a text cut
    and a display cut. Using the wrong cut is the most likely mistake, and the
    first thing a review should look for.
  -->
  <path fill="currentColor" fill-rule="evenodd"
        d="M32 3 L37.93 17.68 L52.51 11.49 L46.32 26.07 L61 32 L46.32 37.93
           L52.51 52.51 L37.93 46.32 L32 61 L26.07 46.32 L11.49 52.51 L17.68 37.93
           L3 32 L17.68 26.07 L11.49 11.49 L26.07 17.68 Z
           M32 25.5 A6.5 6.5 0 1 0 32 38.5 A6.5 6.5 0 1 0 32 25.5 Z"/>
</svg>
