# a database runs out of connections.
#
# `bound_usd` is what one run of this scenario may cost and `resources` is what
# it is made of. Together they are what turns "the cloud suite is expensive"
# into a number a report can be compared against.
scenario_id: rds
title: a database runs out of connections
module: rds
region: eu-west-1
service: rds
team_id: payments

injected_fault: connection_limit_reached
failure_mode: connection_pool_exhaustion
severity: critical
difficulty: 3

integrations:
- aws_rds
- aws
available_evidence:
- aws_rds
- aws

expected_symptom:
- connections_at_limit
- application_connection_errors
expected_root_cause_category: resource_exhaustion
required_keywords:
- connection
- database
- limit
forbidden_categories:
- healthy
- unknown
required_evidence_sources:
- aws_rds
optimal_trajectory:
- aws_rds_resource_inventory
- aws_filter_log_events
max_investigation_loops: 7

# What one run may cost, and what it is made of.
bound_usd: 2.50
resources:
- kind: rds_instance
  hourly_usd: 0.3
  count: 1

validity_probe:
  check: database_connections_at_limit
  timeout_seconds: 300
