# a managed cluster's node group loses capacity.
#
# `bound_usd` is what one run of this scenario may cost and `resources` is what
# it is made of. Together they are what turns "the cloud suite is expensive"
# into a number a report can be compared against.
scenario_id: eks
title: a managed cluster's node group loses capacity
module: eks
region: eu-west-1
service: eks
team_id: payments

injected_fault: node_group_capacity_loss
failure_mode: node_failure
severity: critical
difficulty: 2

integrations:
- aws_eks
- kubernetes
- aws
available_evidence:
- aws_eks
- kubernetes
- aws

expected_symptom:
- pods_pending
- node_count_dropped
expected_root_cause_category: infrastructure_failure
required_keywords:
- node
- capacity
- unschedulable
forbidden_categories:
- healthy
- unknown
required_evidence_sources:
- aws_eks
optimal_trajectory:
- aws_eks_resource_inventory
- kubernetes_workload_events
max_investigation_loops: 6

# What one run may cost, and what it is made of.
bound_usd: 4.00
resources:
- kind: eks_cluster
  hourly_usd: 0.1
  count: 1
- kind: ec2_instance
  hourly_usd: 0.05
  count: 2

validity_probe:
  check: cluster_capacity_below_desired
  timeout_seconds: 300
