# an alarm fires on a metric nothing is writing any more.
#
# `bound_usd` is what one run of this scenario may cost and `resources` is what
# it is made of. Together they are what turns "the cloud suite is expensive"
# into a number a report can be compared against.
scenario_id: cloudwatch
title: an alarm fires on a metric nothing is writing any more
module: cloudwatch
region: eu-west-1
service: cloudwatch
team_id: payments

injected_fault: metric_publication_stopped
failure_mode: missing_configuration
severity: medium
difficulty: 3

integrations:
- aws
- aws_ec2
available_evidence:
- aws
- aws_ec2

expected_symptom:
- alarm_in_insufficient_data
- metric_gap
expected_root_cause_category: configuration_error
required_keywords:
- metric
- alarm
- insufficient
forbidden_categories:
- healthy
- unknown
required_evidence_sources:
- aws
optimal_trajectory:
- aws_list_log_groups
- aws_filter_log_events
max_investigation_loops: 6

# What one run may cost, and what it is made of.
bound_usd: 0.50
resources:
- kind: cloudwatch_alarm
  hourly_usd: 0.001
  count: 3
- kind: log_group
  hourly_usd: 0.002
  count: 1

validity_probe:
  check: alarm_state_is_not_ok
  timeout_seconds: 300
