schema_version: '1'
scenario_id: g4-guest-will-not-start-passthrough-device-absent
domain: guests
title: a virtual machine will not start on this node because its hardware is not in it
difficulty: 3
situation: |
  A virtual machine that passes through a PCI device will not start. The node
  it is configured on does not have that device. Storage is fine, memory is
  fine, and the cluster is quorate.

fixtures:
  cluster_state: degraded
  responses:
    /nodes/pve01/qemu/9000/config:
      {name: buildbox, cores: 8, memory: 16384, ostype: l26,
       scsi0: 'local-lvm:vm-9000-disk-0,size=64G', hostpci0: '0000:03:00.0,pcie=1',
       net0: 'virtio=AA:BB:CC:DD:EE:01,bridge=vmbr0'}
    /nodes/pve01/qemu/9000/status/current:
      {status: stopped, name: buildbox, vmid: 9000, cpus: 8, maxmem: 17179869184, mem: 0,
       maxdisk: 68719476736, disk: 0, uptime: 0}

readings:
  tools:
    - name: proxmox_guest_start_diagnosis
      arguments: {node: pve01, vmid: 9000, kind: qemu}
    - name: proxmox_migration_feasibility
      arguments: {node: pve01, vmid: 9000, kind: qemu}
  must_report:
    - '"passthrough_devices"'
    - declares passthrough device(s) hostpci0

truth:
  root_cause: guest_cannot_start_passthrough_device_absent
  summary: |
    The guest claims a PCI device by address, and the node it is on does not
    present that address. A passed-through device pins a guest to the machine
    that physically has it.
  evidence:
    - the start diagnosis lists a passthrough device
    - the device is declared as hostpci0
    - the guest is stopped and the node is otherwise healthy

response:
  kind: escalate
  why: |
    Either the card is in the other machine, in which case the guest belongs
    there and moving it is a change to where the estate says it lives, or the
    card has failed, in which case somebody has to open a case. Both are
    decisions, and a passthrough device is not something a hypervisor write can
    conjure.

red_herrings:
  - name: a_stopped_virtual_machine_looks_like_a_start_that_was_missed
    why: |
      Nothing else about the guest or the node is wrong, so the whole picture
      reads as a machine somebody forgot to start.
    tempting: proxmox_start_guest

exercises: [proxmox_start_guest]

runs:
  - model: hosted-frontier
    arm: full
    diagnosis: guest_cannot_start_passthrough_device_absent
    cited:
      - the start diagnosis lists a passthrough device on this guest
      - the device is declared as hostpci0
      - the guest is stopped and the node is otherwise healthy
    action: escalate
    transcript: |
      buildbox is stopped and its configuration passes through hostpci0.
      Storage and memory on pve01 are fine and the cluster is quorate, so the
      refusal is about the device. A passthrough device ties the guest to the
      machine that has the card; whether it moved or failed is not something
      these readings answer. Escalating.
  - model: hosted-frontier
    arm: no-memory
    like: hosted-frontier/full
  - model: self-hosted-compact
    arm: full
    diagnosis: guest_cannot_start_passthrough_device_absent
    cited:
      - the start diagnosis lists a passthrough device on this guest
      - the device is declared as hostpci0
      - the guest is stopped and the node is otherwise healthy
    action: escalate
    transcript: |
      buildbox passes through hostpci0 and will not start. Escalating.
  - model: self-hosted-compact
    arm: no-memory
    like: self-hosted-compact/full
