schema_version: '1'
scenario_id: b5-backup-server-datastore-full
domain: backups
title: the backup server has no room left to accept tonight's backup
difficulty: 2
situation: |
  The backup server's datastore is very nearly full and its estimated-full date
  is days away. Backups are still succeeding, and they will stop without
  warning the first night the next one does not fit.

fixtures:
  cluster_state: degraded
  responses:
    /admin/datastore/vault/status:
      {total: 8000000000000, used: 7920000000000, avail: 80000000000,
       'estimated-full-date': 1755200000}
    /admin/datastore/vault/snapshots:
      - {'backup-type': ct, 'backup-id': '115', 'backup-time': 1754800000, size: 8100000000}
      - {'backup-type': ct, 'backup-id': '100', 'backup-time': 1754801200, size: 42000000000}
    /admin/datastore/vault/gc:
      {status: 'never run', upid: ''}
    /config/prune:
      - {id: vault-prune, store: vault, 'keep-last': 2}

readings:
  tools:
    - name: proxmox_backup_server_datastore_health
      arguments: {datastore: vault}
  must_report:
    - '"used_bytes": 7920000000000'
    - '"garbage_collection_status": "never run"'

truth:
  root_cause: backup_server_datastore_full
  summary: |
    The datastore is at ninety-nine per cent and its garbage collection has
    never run, so the space that pruning already released has never been
    reclaimed. The next backup that does not fit fails silently.
  evidence:
    - the datastore reading reports used bytes close to the total
    - garbage collection has never run
    - the prune rules keep only the last two copies

response:
  kind: escalate
  why: |
    Nothing in the hypervisor write set operates the backup server. Garbage
    collection there is the backup server's own job and the choice of when to
    run it belongs to whoever owns its I/O budget. Report the fill level, the
    estimated-full date, and that collection has never run.

red_herrings:
  - name: pruning_looks_like_it_already_solved_this
    why: |
      The prune rules keep only two copies, which reads as aggressive
      retention and therefore as a store that should have room. Pruning marks
      chunks unused; only garbage collection returns the space.
    tempting: proxmox_reclaim_storage

exercises: [proxmox_reclaim_storage]

runs:
  - model: hosted-frontier
    arm: full
    diagnosis: backup_server_datastore_full
    cited:
      - the datastore reading reports used bytes close to the total
      - garbage collection has never run on this datastore
      - the prune rules keep only the last two copies
    action: escalate
    transcript: |
      vault is at 7.92 of 8 terabytes with an estimated-full date days out.
      Retention is keep-last=2, which should be leaving room — but garbage
      collection has never run, so nothing pruning released has come back.
      Reclaiming on the hypervisor side would not touch this store. Escalating
      with the fill, the date and the collection status.
  - model: hosted-frontier
    arm: no-memory
    like: hosted-frontier/full
  - model: self-hosted-compact
    arm: full
    diagnosis: backup_server_datastore_full
    cited:
      - the datastore reading reports used bytes close to the total
      - garbage collection has never run on this datastore
      - the prune rules keep only the last two copies
    action: escalate
    transcript: |
      vault is nearly full and garbage collection has never run. Escalating.
  - model: self-hosted-compact
    arm: no-memory
    like: self-hosted-compact/full
