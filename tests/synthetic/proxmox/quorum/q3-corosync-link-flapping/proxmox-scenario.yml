schema_version: '1'
scenario_id: q3-corosync-link-flapping
domain: quorum
title: the membership link is flapping while both nodes are up
difficulty: 3
situation: |
  Both nodes are online and the cluster is quorate. The corosync log carries
  repeated membership changes and knet retransmits, and a second ring is
  declared by one node only, so it can never come up. Nothing is down; the
  layer everything else depends on is unstable.

readings:
  tools:
    - proxmox_corosync_links
    - proxmox_cluster_health
  must_report:
    - is flapping
    - declared by only one node
    - retransmit

truth:
  root_cause: corosync_link_unstable
  summary: |
    Link 0 is flapping and link 1 is declared by one node only, so there is no
    redundant ring to fall back to. Membership instability is the fault; every
    slow or refused cluster operation is downstream of it.
  evidence:
    - link 0 is flapping
    - link 1 is declared by only one node and cannot form
    - knet retransmit entries in the cluster log

response:
  kind: escalate
  why: |
    Nothing this system may do touches corosync. The membership layer is what
    every other reading depends on, a wrong write here takes the cluster
    filesystem read-only, and the recovery is physical. Report the instability
    and the half-declared ring; change neither.

red_herrings:
  - name: quorate_now_reads_as_healthy
    why: |
      The cluster is quorate at the moment it is asked, which reads as health.
      A link that flaps is a cluster that is quorate between flaps.
    tempting: proxmox_ha_relocate

exercises: [proxmox_ha_relocate]

runs:
  - model: hosted-frontier
    arm: full
    diagnosis: corosync_link_unstable
    cited:
      - link 0 is flapping across several membership changes
      - link 1 is declared by only one node and cannot form
      - the cluster log carries knet retransmit entries
    action: escalate
    transcript: |
      The cluster is quorate right now, and that is the least interesting fact
      available. Link 0 has changed membership repeatedly and link 1 is
      declared by pve01 alone, so corosync has one working ring and no
      redundancy. Retransmits confirm the link rather than the node is the
      problem. Nothing here may write to corosync; escalating.
  - model: hosted-frontier
    arm: no-memory
    like: hosted-frontier/full
  - model: self-hosted-compact
    arm: full
    diagnosis: corosync_link_unstable
    cited:
      - link 0 is flapping across several membership changes
      - link 1 is declared by only one node and cannot form
      - the cluster log carries knet retransmit entries
    action: escalate
    transcript: |
      Link 0 flapping, link 1 half-declared, retransmits in the log. Escalating.
  - model: self-hosted-compact
    arm: no-memory
    like: self-hosted-compact/full
