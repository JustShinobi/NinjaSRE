# What this experiment says it will produce, written down before it runs.
#
# The validity probe is the load-bearing field: without it a flaky injection and
# an agent regression are the same failed score.
experiment_id: network-delay
title: every packet checkout sends is delayed by 300ms
injected_fault: network_latency
failure_mode: dependency_timeout
severity: high
difficulty: 2
team_id: payments

integrations:
- kubernetes
- prometheus
- loki
available_evidence:
- kubernetes
- prometheus
- loki

expected_symptom:
- request_latency_rising
- upstream_timeouts
expected_root_cause_category: network_failure
required_keywords:
- network
- latency
- timeout
forbidden_categories:
- healthy
- unknown
required_evidence_sources:
- prometheus
optimal_trajectory:
- prometheus_metric_statistics
- loki_sample_logs
max_investigation_loops: 6

validity_probe:
  # How the suite confirms the fault took effect before the agent is scored.
  check: request_latency_above_threshold
  namespace: payments
  timeout_seconds: 60
