# What this experiment says it will produce, written down before it runs.
#
# The validity probe is the load-bearing field: without it a flaky injection and
# an agent regression are the same failed score.
experiment_id: memory-stress
title: checkout is driven past its memory limit
injected_fault: memory_pressure
failure_mode: memory_exhaustion
severity: critical
difficulty: 2
team_id: payments

integrations:
- kubernetes
- prometheus
available_evidence:
- kubernetes
- prometheus

expected_symptom:
- memory_saturated
- oom_kills
expected_root_cause_category: resource_exhaustion
required_keywords:
- memory
- limit
- oomkilled
forbidden_categories:
- healthy
- unknown
required_evidence_sources:
- kubernetes
optimal_trajectory:
- kubernetes_workload_events
- prometheus_metric_statistics
max_investigation_loops: 6

validity_probe:
  # How the suite confirms the fault took effect before the agent is scored.
  check: memory_utilisation_above_threshold
  namespace: payments
  timeout_seconds: 60
