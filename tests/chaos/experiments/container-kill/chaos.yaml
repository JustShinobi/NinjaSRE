# the checkout container's process is killed repeatedly.
#
# The suite appends the run identifier to metadata.name and adds the labels a
# sweep finds an orphan by, so nothing here needs to know which run applied it.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: container-kill
  namespace: chaos-testing
spec:
  action: container-kill
  mode: one
  containerNames:
    - checkout
  selector:
    namespaces:
      - payments
    labelSelectors:
      app: checkout
  duration: "60s"
