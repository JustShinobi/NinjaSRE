# What this experiment says it will produce, written down before it runs.
#
# The validity probe is the load-bearing field: without it a flaky injection and
# an agent regression are the same failed score.
experiment_id: network-partition
title: checkout and payments are cut off from each other
injected_fault: network_partition
failure_mode: network_partition
severity: critical
difficulty: 2
team_id: payments

integrations:
- kubernetes
- prometheus
- loki
available_evidence:
- kubernetes
- prometheus
- loki

expected_symptom:
- service_unreachable
- connection_refused_errors
expected_root_cause_category: network_failure
required_keywords:
- partition
- unreachable
- network
forbidden_categories:
- healthy
- unknown
required_evidence_sources:
- loki
optimal_trajectory:
- loki_sample_logs
- kubernetes_workload_events
max_investigation_loops: 6

validity_probe:
  # How the suite confirms the fault took effect before the agent is scored.
  check: peer_unreachable_from_pod
  namespace: payments
  timeout_seconds: 60
