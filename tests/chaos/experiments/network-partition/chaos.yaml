# checkout and payments are cut off from each other.
#
# The suite appends the run identifier to metadata.name and adds the labels a
# sweep finds an orphan by, so nothing here needs to know which run applied it.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-partition
  namespace: chaos-testing
spec:
  action: partition
  mode: all
  selector:
    namespaces:
      - payments
    labelSelectors:
      app: checkout
  direction: both
  target:
    mode: all
    selector:
      namespaces:
        - payments
      labelSelectors:
        app: payments
  duration: "300s"
