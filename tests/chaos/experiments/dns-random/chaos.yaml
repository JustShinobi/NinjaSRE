# checkout's name lookups return an address nobody is listening on.
#
# The suite appends the run identifier to metadata.name and adds the labels a
# sweep finds an orphan by, so nothing here needs to know which run applied it.
apiVersion: chaos-mesh.org/v1alpha1
kind: DNSChaos
metadata:
  name: dns-random
  namespace: chaos-testing
spec:
  action: random
  mode: all
  selector:
    namespaces:
      - payments
    labelSelectors:
      app: checkout
  patterns:
    - "*.payments.svc.cluster.local"
  duration: "300s"
