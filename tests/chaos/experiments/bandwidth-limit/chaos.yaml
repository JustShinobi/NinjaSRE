# checkout's egress is capped at one megabit.
#
# The suite appends the run identifier to metadata.name and adds the labels a
# sweep finds an orphan by, so nothing here needs to know which run applied it.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: bandwidth-limit
  namespace: chaos-testing
spec:
  action: bandwidth
  mode: all
  selector:
    namespaces:
      - payments
    labelSelectors:
      app: checkout
  bandwidth:
    rate: "1mbps"
    limit: 20971520
    buffer: 10000
  direction: to
  duration: "300s"
