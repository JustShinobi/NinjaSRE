# What this experiment says it will produce, written down before it runs.
#
# The validity probe is the load-bearing field: without it a flaky injection and
# an agent regression are the same failed score.
experiment_id: cpu-stress
title: checkout's CPU is pinned at its limit
injected_fault: cpu_saturation
failure_mode: cpu_saturation
severity: high
difficulty: 2
team_id: payments

integrations:
- kubernetes
- prometheus
available_evidence:
- kubernetes
- prometheus

expected_symptom:
- cpu_saturated
- latency_rising
expected_root_cause_category: resource_exhaustion
required_keywords:
- cpu
- saturat
- throttl
forbidden_categories:
- healthy
- unknown
required_evidence_sources:
- prometheus
optimal_trajectory:
- prometheus_metric_statistics
- kubernetes_workload_events
max_investigation_loops: 6

validity_probe:
  # How the suite confirms the fault took effect before the agent is scored.
  check: cpu_utilisation_above_threshold
  namespace: payments
  timeout_seconds: 60
