# payments answers every request with a 500.
#
# The suite appends the run identifier to metadata.name and adds the labels a
# sweep finds an orphan by, so nothing here needs to know which run applied it.
apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: http-response-fault
  namespace: chaos-testing
spec:
  mode: all
  selector:
    namespaces:
      - payments
    labelSelectors:
      app: payments
  target: Response
  port: 8080
  replace:
    code: 500
    body: eyJlcnJvciI6ImluamVjdGVkIn0=
  duration: "300s"
