# What this experiment says it will produce, written down before it runs.
#
# The validity probe is the load-bearing field: without it a flaky injection and
# an agent regression are the same failed score.
experiment_id: http-response-fault
title: payments answers every request with a 500
injected_fault: http_error_response
failure_mode: dependency_outage
severity: critical
difficulty: 2
team_id: payments

integrations:
- kubernetes
- prometheus
- loki
available_evidence:
- kubernetes
- prometheus
- loki

expected_symptom:
- http_5xx_rising
- error_rate_rising
expected_root_cause_category: dependency_failure
required_keywords:
- http
- "500"
- error
forbidden_categories:
- healthy
- unknown
required_evidence_sources:
- prometheus
optimal_trajectory:
- prometheus_metric_statistics
- loki_sample_logs
max_investigation_loops: 6

validity_probe:
  # How the suite confirms the fault took effect before the agent is scored.
  check: http_error_rate_above_threshold
  namespace: payments
  timeout_seconds: 60
