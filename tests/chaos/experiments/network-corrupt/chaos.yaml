# three packets in ten leave checkout corrupted.
#
# The suite appends the run identifier to metadata.name and adds the labels a
# sweep finds an orphan by, so nothing here needs to know which run applied it.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-corrupt
  namespace: chaos-testing
spec:
  action: corrupt
  mode: all
  selector:
    namespaces:
      - payments
    labelSelectors:
      app: checkout
  corrupt:
    corrupt: "30"
    correlation: "50"
  direction: to
  duration: "300s"
