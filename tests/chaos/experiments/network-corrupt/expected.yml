# What this experiment says it will produce, written down before it runs.
#
# The validity probe is the load-bearing field: without it a flaky injection and
# an agent regression are the same failed score.
experiment_id: network-corrupt
title: three packets in ten leave checkout corrupted
injected_fault: packet_corruption
failure_mode: data_corruption
severity: high
difficulty: 3
team_id: payments

integrations:
- kubernetes
- prometheus
- loki
available_evidence:
- kubernetes
- prometheus
- loki

expected_symptom:
- connection_resets
- retransmissions_rising
expected_root_cause_category: network_failure
required_keywords:
- corrupt
- packet
- retransmi
forbidden_categories:
- healthy
- unknown
required_evidence_sources:
- prometheus
optimal_trajectory:
- prometheus_metric_statistics
- loki_sample_logs
max_investigation_loops: 7

validity_probe:
  # How the suite confirms the fault took effect before the agent is scored.
  check: packet_loss_above_threshold
  namespace: payments
  timeout_seconds: 60
