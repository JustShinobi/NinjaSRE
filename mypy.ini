[mypy]
python_version = 3.12
strict = True
warn_unused_configs = True
show_error_codes = True
show_column_numbers = True

# ``tests/`` is outside the CI type gate: ``make typecheck`` passes only the
# seven first-party packages. It stays runnable on demand with
# ``uv run mypy tests``. The architecture fixtures are excluded outright —
# they are deliberately broken module trees, not code under type control.
exclude = (?x)(
    ^_research/
    | ^tests/architecture/fixtures/
    | ^\.venv/
  )

[mypy-asyncpg.*]
# The driver ships no stubs. Only the exception hierarchy is named directly,
# by the pool connect hook that loads the graph library.
ignore_missing_imports = True
