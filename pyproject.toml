[project]
name = "ninjasre"
version = "0.1.0"
description = "Self-hosted AI SRE platform that investigates incidents, learns from every run, and proves it improves."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "NinjaSRE contributors" }]
keywords = ["sre", "incident-response", "observability", "agent", "self-hosted"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]

# Runtime dependencies only. Anything matching the telemetry deny-list in
# ``tools/check_dependencies.py`` is rejected in CI (Constitution Article X).
#
# The datastore is not an extra, and the asymmetry with the LLM SDKs below is
# deliberate. Provider neutrality (Article VI) says no vendor SDK may be
# required; the single datastore (Article XI, ADR 0004) says exactly one store
# is. A deployment installs PostgreSQL and these five, and chooses which model
# provider — if any — to add.
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "cryptography>=44.0",
    "pgvector>=0.3.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4.0",
]

# Vendor LLM SDKs are extras, never runtime dependencies. A deployment that runs
# on a local model installs ``ninjasre[ollama]`` and gets nothing from Anthropic,
# OpenAI, or AWS in its dependency tree — which is what "provider neutral" has to
# mean if it is going to mean anything. ``core/llm/transports/sdk.py`` imports
# each of these inside a function and reports the missing extra by name.
[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.60"]
# Azure OpenAI, OpenRouter, NVIDIA NIM, and Ollama/vLLM all speak the OpenAI
# wire, so they share its client.
azure = ["openai>=1.60"]
openrouter = ["openai>=1.60"]
nvidia = ["openai>=1.60"]
ollama = ["openai>=1.60"]
bedrock = ["boto3>=1.35"]
google = ["google-genai>=1.0"]
litellm = ["litellm>=1.50"]
all-providers = [
    "anthropic>=0.40",
    "boto3>=1.35",
    "google-genai>=1.0",
    "openai>=1.60",
]

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    # Provides the PostgreSQL the contract suite runs its second backend
    # against. Absent a Docker daemon the suite still runs, against the fakes
    # alone, and says so rather than reporting a pass it did not earn.
    "testcontainers>=4.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The seven first-party runtime packages, and only those. Root ``tools/`` holds
# repository tooling and ``tests/`` is not distributed — both are excluded by
# omission rather than by a negative glob, so a new top-level directory cannot
# leak into the wheel by accident.
[tool.hatch.build.targets.wheel]
packages = [
    "capabilities",
    "config",
    "core",
    "gateway",
    "integrations",
    "platform",
    "surfaces",
]

[tool.hatch.build.targets.sdist]
include = [
    "/capabilities",
    "/config",
    "/core",
    "/gateway",
    "/integrations",
    "/platform",
    "/surfaces",
    "/tests",
    "/tools",
    "/Makefile",
    "/.importlinter",
    "/mypy.ini",
    "/pytest.ini",
    "/ruff.toml",
]
