[project]
name = "ninjasre"
version = "0.1.0"
description = "Self-hosted AI SRE platform that investigates incidents, learns from every run, and proves it improves."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "NinjaSRE contributors" }]
keywords = ["sre", "incident-response", "observability", "agent", "self-hosted"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]

# Runtime dependencies only. Anything matching the telemetry deny-list in
# ``tools/check_dependencies.py`` is rejected in CI (Constitution Article X).
#
# The datastore is not an extra, and the asymmetry with the LLM SDKs below is
# deliberate. Provider neutrality (Article VI) says no vendor SDK may be
# required; the single datastore (Article XI, ADR 0004) says exactly one store
# is. A deployment installs PostgreSQL and these six, and chooses which model
# provider — if any — to add.
#
# ``pyyaml`` is here rather than in an extra because guardrail rules are an
# operator-editable file that has to load in every deployment. A deployment that
# could not parse its ruleset would start unguarded, which FR-012 forbids.
#
# ``pydantic`` is here for the same class of reason. Configuration is the one
# subsystem whose input is written by an operator rather than produced by the
# platform, and every deployment has to reject a malformed document with an
# error naming the field. It is not an extra because a deployment that could not
# validate its configuration would resolve to defaults nobody chose.
#
# The last three are the ``ninjasre`` command. Not an extra, because the CLI is
# how the platform is operated, debugged, and demonstrated — a deployment that
# installed the platform and could not run the command would have installed a
# library. Every one of them renders and prompts; none of them transmits
# anything, which is what keeps the telemetry deny-list satisfied by
# construction rather than by review.
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "cryptography>=44.0",
    # The REST/SSE surface (feature 020). Unlike the credential proxy's
    # hand-written ASGI, this surface is dozens of versioned routes with a
    # generated OpenAPI document (FR-006) — routing and schema by hand at that
    # size is where the hand-rolled approach stops paying for itself.
    "fastapi>=0.115",
    "pgvector>=0.3.6",
    # The interactive session's input: history, completion, and the terminal
    # handling that lets Ctrl+C reach the loop rather than the process.
    "prompt-toolkit>=3.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
    # Rendering for a person. The degradation layer decides what a terminal can
    # show before this is asked to draw anything, so a terminal with no colour
    # and no Unicode is served by the same code path.
    "rich>=13.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4.0",
    # The CLI framework, and the shell completion that comes with it.
    "typer>=0.15",
    # The REST/SSE server. A production deployment runs behind whatever ASGI
    # server the operator already trusts; this is the one that ships so
    # ``ninjasre serve`` works with nothing extra to install.
    "uvicorn>=0.32",
]

# Vendor LLM SDKs are extras, never runtime dependencies. A deployment that runs
# on a local model installs ``ninjasre[ollama]`` and gets nothing from Anthropic,
# OpenAI, or AWS in its dependency tree — which is what "provider neutral" has to
# mean if it is going to mean anything. ``core/llm/transports/sdk.py`` imports
# each of these inside a function and reports the missing extra by name.
[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.60"]
# Azure OpenAI, OpenRouter, NVIDIA NIM, and Ollama/vLLM all speak the OpenAI
# wire, so they share its client.
azure = ["openai>=1.60"]
openrouter = ["openai>=1.60"]
nvidia = ["openai>=1.60"]
ollama = ["openai>=1.60"]
bedrock = ["boto3>=1.35"]
google = ["google-genai>=1.0"]
litellm = ["litellm>=1.50"]
all-providers = [
    "anthropic>=0.40",
    "boto3>=1.35",
    "google-genai>=1.0",
    "openai>=1.60",
]

[dependency-groups]
dev = [
    # Drives the ASGI app under test — FastAPI's own TestClient is built on it.
    # Never imported outside test code.
    "httpx>=0.27",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    # PyYAML ships no inline types, and ``mypy --strict`` over ``platform/``
    # covers the guardrail rule loader. A stubs package rather than an
    # ``ignore_missing_imports`` entry: the loader is parsing an operator's file
    # into security rules, and that is the last place to give up type coverage.
    "types-PyYAML>=6.0",
    # Provides the PostgreSQL the contract suite runs its second backend
    # against. Absent a Docker daemon the suite still runs, against the fakes
    # alone, and says so rather than reporting a pass it did not earn.
    "testcontainers>=4.9",
]

# The one command an operator runs. Nothing else is exposed: a second entry
# point would be a second surface, and every surface has to produce the same
# result and the same trace.
[project.scripts]
ninjasre = "surfaces.entrypoint:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The seven first-party runtime packages, and only those. Root ``tools/`` holds
# repository tooling and ``tests/`` is not distributed — both are excluded by
# omission rather than by a negative glob, so a new top-level directory cannot
# leak into the wheel by accident.
[tool.hatch.build.targets.wheel]
packages = [
    "capabilities",
    "config",
    "core",
    "gateway",
    "integrations",
    "platform",
    "surfaces",
]

[tool.hatch.build.targets.sdist]
include = [
    "/capabilities",
    "/config",
    "/core",
    "/gateway",
    "/integrations",
    "/platform",
    "/surfaces",
    "/tests",
    "/tools",
    "/Makefile",
    "/.importlinter",
    "/mypy.ini",
    "/pytest.ini",
    "/ruff.toml",
]
