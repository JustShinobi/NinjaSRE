; Alembic's configuration, for autogenerating a revision from a contributor's shell:
;
;     uv run alembic -c platform/persistence/migrations/alembic.ini revision \
;         --autogenerate -m "add the thing"
;
; The running platform does not read this file. It calls
; ``platform.persistence.postgres.migrations.upgrade_to_head`` with its own
; engine, so nothing here is deployment configuration.
;
; ``sqlalchemy.url`` is deliberately empty: the URL comes from
; NINJASRE_DATABASE_URL, and a URL committed here is a URL somebody eventually
; points at production by accident.

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../../..
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
