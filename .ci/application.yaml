schemaVersion: 1
application: ninjasre-stg

components:
  - name: app
    context: .
    dockerfile: deploy/images/app.Dockerfile
    image: registry.lan.kyo.ninja/ninjasre/app
    workload: app
    container: app
    rolloutProfile: deployment
    platforms:
      - linux/amd64

  # There is no `console` component here, and its absence is a decision rather
  # than an omission. That image is the same wheel as `app` started at a second
  # entry point — a whole second copy of the deployment, not a front end — and
  # the copy this cluster ran drifted eighteen hours behind while `web` pointed
  # at it, so a browser read pages the running code had stopped producing.
  # `web` now calls `app`, which serves the identical API, and every screen and
  # the whole incident demo have run through that path since.
  #
  # What it costs: browser traffic and agent traffic share one gateway, where
  # the retired shape kept them apart. If that isolation is wanted back, the
  # workload has to return to the GitOps image patch as well — a component this
  # file names and the patch does not is a digest the cluster never reads, which
  # is exactly how this was found.
  #
  # The compose and LXC shapes still build that image; this file is only the
  # staging cluster's.

  # The console a browser loads. A separate component from `console`, which is
  # the gateway it calls: one answers requests, the other renders what a person
  # looks at. Without this the ingress points a browser at a gateway and every
  # request for `/` is a JSON 404.
  - name: web
    context: .
    dockerfile: deploy/images/web.Dockerfile
    image: registry.lan.kyo.ninja/ninjasre/web
    workload: web
    container: web
    rolloutProfile: deployment
    platforms:
      - linux/amd64

  - name: proxy
    context: .
    dockerfile: deploy/images/proxy.Dockerfile
    image: registry.lan.kyo.ninja/ninjasre/proxy
    workload: proxy
    container: proxy
    rolloutProfile: deployment
    platforms:
      - linux/amd64

gitops:
  repository: JustShinobi/k3s-gitops-prod
  baseBranch: main
  stagingBranch: deploy/stg
  productionBranch: deploy/stg
  stagingPath: clusters/prod/workloads/ninjasre-stg
  productionPath: clusters/prod/workloads/ninjasre-stg
  stagingApplication: stg-ninjasre
  productionApplication: stg-ninjasre
  imagePromotion: kustomize-images
