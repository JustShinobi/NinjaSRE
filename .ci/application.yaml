schemaVersion: 1
application: ninjasre-stg

components:
  - name: app
    context: .
    dockerfile: deploy/images/app.Dockerfile
    image: registry.lan.kyo.ninja/ninjasre/app
    workload: app
    container: app
    rolloutProfile: deployment
    platforms:
      - linux/amd64

  - name: console
    context: .
    dockerfile: deploy/images/console.Dockerfile
    image: registry.lan.kyo.ninja/ninjasre/console
    workload: console
    container: console
    rolloutProfile: deployment
    platforms:
      - linux/amd64

  - name: proxy
    context: .
    dockerfile: deploy/images/proxy.Dockerfile
    image: registry.lan.kyo.ninja/ninjasre/proxy
    workload: proxy
    container: proxy
    rolloutProfile: deployment
    platforms:
      - linux/amd64

  - name: postgres
    context: .
    dockerfile: deploy/images/postgres.Dockerfile
    image: registry.lan.kyo.ninja/ninjasre/postgres
    workload: postgres
    container: postgres
    rolloutProfile: deployment
    platforms:
      - linux/amd64

gitops:
  repository: JustShinobi/k3s-gitops-prod
  baseBranch: main
  stagingBranch: deploy/stg
  productionBranch: deploy/stg
  stagingPath: clusters/prod/workloads/ninjasre-stg
  productionPath: clusters/prod/workloads/ninjasre-stg
  stagingApplication: stg-ninjasre
  productionApplication: stg-ninjasre
  imagePromotion: kustomize-images
